<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="SAAS Foundry mark">
  <title>SAAS Foundry</title>
  <!-- Forge face: a hexagonal die, the shape a billet takes under the hammer -->
