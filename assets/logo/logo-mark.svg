        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <circle cx="20" cy="13" r="3.4" fill="#F39C2D"/>
  <circle cx="12.5" cy="26" r="2.7" fill="#18D2E8"/>
  <circle cx="27.5" cy="26" r="2.7" fill="#18D2E8"/>
